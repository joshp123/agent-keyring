syntax = "proto3";
package agentkeyring.clientstate;
import "agentkeyring/v1/agentkeyring.proto";
option go_package = "github.com/joshp123/agent-keyring/internal/clientstate";
// Local receiver storage, never a relay wire contract. PrivateKeys is stored
// separately in an owner-only file on macOS and Linux.
message PrivateKeys {
  bytes certificate_pem = 1;
  bytes tls_key_pem = 2;
  bytes receiver_private_key = 3;
}
message State {
  string relay_address = 1;
  bytes relay_spki = 2;
  string recipient_id = 3;        // This machine's id in Members.
  reserved 4, 5, 6, 7, 9, 10, 12, 15;
  repeated ExpectedRequest requests = 8;
  string machine_label = 11;
  repeated OperationReceipt operations = 13;
  LocalAuthority local_authority = 14;
  // The newest Members this machine has checked, as a serialized
  // agentkeyring.v2.Signed. Answers are verified against it.
  bytes members = 16;
  // The newest Catalogue revision this machine has seen; an older one is a
  // relay replaying the past (a login no longer Automatic, still served).
  uint64 catalogue_revision = 17;
}
message LocalAuthority {
  string application_contents = 1;
  string bundle_id = 2;
}
message ExpectedRequest {
  agentkeyring.v1.RequestLeaseRequest scope = 1;
  string lease_id = 2;
  reserved 3;                    // Automatic uses kept only here: the relay records them now.
  bool ended = 4;
  // A device's approval, as the relay gave it (agentkeyring.v2.Approval),
  // kept for its window so it still works if the relay cannot be reached.
  // Its delivery is sealed to this machine's receiving key; it holds the
  // window's one-time codes, never the code secret. It is checked again on
  // each use, and deleted on release or once approval_not_after has passed.
  bytes approval = 5;
  int64 approval_not_after_unix_seconds = 6;  // From the signed answer.
  // The request this machine wrote and signed (agentkeyring.v2.Signed),
  // saved before it is sent so a retry sends the same bytes. Approvals and
  // denials are checked against these exact bytes.
  bytes request = 7;
  // An Automatic login: this machine opens its own sealed copy while the
  // relay says the use is approved.
  bool automatic = 8;
}
message OperationReceipt {
  string lease_id = 1;
  string key = 2;
  bytes digest = 3;
  int64 lease_deadline_unix_seconds = 4;
  // No outcome means Started: inspect before deliberately repeating it.
  oneof outcome {
    agentkeyring.v1.FillOutcome fill = 5;
    bool read_delivered = 7;
  }
  reserved 6, 8;                // A program's outcome and exit code.
}
