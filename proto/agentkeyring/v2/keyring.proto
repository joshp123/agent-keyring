// Written by AI on 2026.11.18 by model claude opus 5.5.
//
// Agent Keyring, version 2: sealed logins and the relay.
//
// Each login's secret is sealed separately to the opening key of each device
// that may approve it (iPhone, Watch, MacBook), and to each machine allowed to
// use it with no question (Automatic). Site and account stay readable in the
// catalogue. Approving means a device opens the one sealed login and seals it
// again for the machine that asked, valid for 30 minutes at most. The relay
// stores sealed logins, requests and answers, and wakes the devices; it can
// open nothing.
//
// Keys. Every key is P-256. A device holds two keys in its Secure Enclave,
// usable only after Face ID, Touch ID, or (Watch) while unlocked on the wrist:
// a signing key, which signs approvals and the documents below, and an opening
// key, to which logins are sealed. One approval unlocks both. It also holds two
// keys usable whenever it is unlocked, with no face or finger: a reply key,
// which signs only denials with words (iOS hands a typed reply to the app where
// Face ID cannot be shown), and a notice key, to which the relay seals what a
// push shows. A machine holds a software receiving key, to which approvals are
// sealed. Devices other than the Watch, and machines, also hold a TLS key for
// their connection to the relay. Key ids are lowercase hex SHA-256 of the
// public key bytes named below.
//
// Signatures. ECDSA P-256 with SHA-256, DER encoded, over the exact payload
// bytes in Signed. Verifiers parse those bytes; nobody re-encodes them.
//
// Sealing. HPKE (RFC 9180) base mode, DHKEM(P-256, HKDF-SHA256), HKDF-SHA256,
// AES-256-GCM. CryptoKit: HPKE.Ciphersuite.P256_SHA256_AES_GCM_256. Go:
// crypto/hpke. The info and associated data are given with each sealed message.
//
// Wire. Mutual TLS 1.3 with self-signed certificates, each side pinning the
// other's exact SubjectPublicKeyInfo; one method per connection; frames are a
// 4-byte unsigned big-endian length then a serialized protobuf.
// RelayRequest selects the method; each RelayResponse has end_of_stream set on
// its last frame. Frames are at most 4 MiB. Nothing is reachable from outside the tailnet.
//
// The Watch cannot open raw TLS connections, so it posts its answers over
// HTTPS to the same address and port: "POST /v2/answer" with a serialized
// AnswerUpload as the body, no client certificate, the relay pinned by
// Members.relay_tls_public_key. Only a signed answer from a WATCH device is
// taken there. The reply is 200 with a serialized Lease, or 4xx with the
// error in words. Its work arrives in a push.

syntax = "proto3";

package agentkeyring.v2;

option go_package = "github.com/joshp123/agent-keyring/gen/go/agentkeyring/v2;agentkeyringv2";

// ---- Signed documents ----------------------------------------------------

// The one envelope for everything signed. The payload's own domain field says
// what it is; a verifier refuses a payload whose domain it did not expect.
message Signed {
  bytes payload = 1;
  bytes signature = 2;
  // Device.key_id, when signed with the device's signing key; or Device.reply_key_id,
  // when signed with its reply key, which is valid only on an Answer that denies.
  string signer_key_id = 3;
}

// Who may approve and who may ask. Revision 1 is signed by a device it lists.
// Revision n+1 is valid only if signed by a device listed in the revision the
// verifier already holds, with its signing key. Any device may sign: Josh
// removes a lost MacBook from his iPhone. Verifiers keep the highest valid
// revision and refuse a lower one.
message Members {
  string domain = 1;  // "agentkeyring.members.v2"
  uint64 revision = 2;
  repeated Device devices = 3;
  repeated Machine machines = 4;
  bytes relay_tls_public_key = 5;  // SPKI DER; machines and devices pin it.
  // The machine that runs the relay and passes requests on to the iPhone and
  // Apple Watch (the computer that stays on). Empty until one is added.
  string relay_machine_id = 6;
  // Revision 1 only, on a relay that announced itself (SetupOffer):
  // HMAC-SHA256 with the offer's secret over "agentkeyring.setup.v2", the
  // relay's SPKI and the first device's key id. An empty relay that made an
  // offer refuses a first list without it, so the first Mac to reach it cannot take it.
  bytes setup_proof = 7;
}

message Device {
  string key_id = 1;               // SHA-256 of signing_public_key.
  DeviceKind kind = 2;
  string label = 3;                // As the person named it, e.g. "MacBook Pro".
  bytes signing_public_key = 4;    // X9.63 uncompressed.
  bytes opening_public_key = 5;    // X9.63 uncompressed. Logins are sealed to it.
  bytes tls_public_key = 6;        // SPKI DER. Empty for the Watch.
  string reply_key_id = 7;         // SHA-256 of reply_public_key.
  bytes reply_public_key = 8;      // X9.63 uncompressed. Signs only denials with words.
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_MAC = 1;
  DEVICE_KIND_IPHONE = 2;
  DEVICE_KIND_WATCH = 3;
}

message Machine {
  string machine_id = 1;           // SHA-256 of tls_public_key.
  string label = 2;                // e.g. "Mac mini".
  bytes tls_public_key = 3;        // SPKI DER.
  bytes receiving_public_key = 4;  // X9.63 uncompressed. Approvals are sealed to it.
  // May hold Automatic logins. Sealing them to this machine is what grants
  // them; this flag tells devices to do so on import and rule changes.
  bool automatic_allowed = 5;
}

// The logins and their rules: names readable, secrets never. Signed by any
// device in the current Members, with its signing key. Same revision rule as
// Members: machines and devices keep the highest revision they have seen.
message Catalogue {
  string domain = 1;  // "agentkeyring.catalogue.v2"
  uint64 revision = 2;
  repeated Login logins = 3;
  int64 imported_unix_seconds = 4;
}

message Login {
  string login_id = 1;             // Stable across imports.
  string title = 2;
  repeated string sites = 3;       // Saved sites; the delivery is limited to these.
  string account = 4;
  bool has_one_time_code = 5;
  Rule rule = 6;
  reserved 7;                      // Approval on the iPhone or Watch only: cut.
  // The version of every sealed copy of this login (SealedLogin.version).
  // Whoever publishes a catalogue carries it over unchanged; only a new import
  // of the secret changes it. Openers refuse a copy of another version.
  uint64 version = 8;
}

enum Rule {
  RULE_UNSPECIFIED = 0;
  RULE_ASK = 1;
  RULE_AUTOMATIC = 2;              // Also sealed to machines with automatic_allowed.
  RULE_BLOCKED = 3;                // Devices refuse to open it for anyone.
}

// ---- Sealed logins ---------------------------------------------------------

// One login sealed to one key: a device's opening key, or a machine's
// receiving key for an Automatic login.
// info = "agentkeyring.login.v2"
// aad  = uint32 BE length || opener_id UTF-8 || uint32 BE length || login_id UTF-8
// plaintext = serialized LoginSecret, whose login_id must equal login_id here.
message SealedLogin {
  string login_id = 1;
  string opener_id = 2;            // Device.key_id or Machine.machine_id.
  bytes encapsulated_key = 3;
  bytes ciphertext = 4;
  // The device that sealed it, by its reply key (no Face ID or Touch ID), so a
  // relay can neither forge a copy nor pass one off as another login's:
  // ECDSA P-256 SHA-256, DER, over "agentkeyring.sealed.v2" and the
  // length-prefixed login_id, opener_id, encapsulated_key and ciphertext,
  // then version as 8 bytes big-endian. Openers check it against a device in
  // their Members before opening.
  string signer_key_id = 5;        // Device.reply_key_id.
  bytes signature = 6;
  // When the secret was imported, in Unix nanoseconds. Resealing keeps it, so
  // a relay cannot serve an older copy: it must equal the catalogue's Login.version.
  uint64 version = 7;
}

message LoginSecret {
  string login_id = 1;
  string username = 2;
  string password = 3;
  bytes totp_seed = 4;             // Empty when the login has no one-time code.
  int32 totp_period_seconds = 5;   // Default 30.
  int32 totp_digits = 6;           // Default 6.
  string totp_algorithm = 7;       // "SHA1" (default), "SHA256" or "SHA512".
  // What the login was sealed as. Openers compare these and username with the
  // login they show or deliver for (the signed Catalogue's Login, or the Mac's
  // own list) and refuse a copy that does not match.
  string title = 8;
  repeated string sites = 9;
}

// ---- Requests and answers --------------------------------------------------
// Written and signed by the asking machine with its TLS key (RelayRequest.ask_signed;
// Work.request_signature). Devices check the signature against the machine
// their own Members lists as machine_id, show what they parse from these exact
// bytes, check the login against their own catalogue, and answer over them.
// The relay refuses one whose asked time is over 5 minutes from its clock,
// which waits over 10 minutes, or whose reason is over 400 bytes or agent,
// project or task over 100, so that a Work still fits in a push.
message Request {
  string domain = 1;               // "agentkeyring.request.v2"
  string request_id = 2;           // Chosen by the asking machine: 16 random bytes, hex.
  string login_id = 3;
  string machine_id = 4;           // The machine that signed it.
  reserved 5, 6;                   // Purpose and program: one approval covers fill and read.
  string reason = 7;               // The agent's own words.
  string agent = 8;                // The agent's claim, e.g. "Codex".
  string project = 9;              // The agent's claim: its Git repository's name.
  string task = 10;                // The agent's grouping of requests into one job.
  int64 asked_unix_seconds = 11;
  int64 answer_by_unix_seconds = 12;  // After this the request is unanswered.
  // A practice request: it names no login, goes only to this device, and is
  // approved by a signed Answer with no delivery. Signed like any request, by
  // the machine that made it, or by the relay's TLS key for one a device asked
  // the relay for (test_request).
  string for_device_key_id = 13;
  // The machine uses its own copy of an Automatic login: the relay grants it
  // at once, for 30 minutes, if the catalogue says Automatic and Members
  // allows this machine. Devices show it in use and may stop it.
  bool automatic = 14;
  // Where this request's answers go: the asking machine's door, "IP:17446"
  // with its Tailscale IP address (never a name), and the TLS key it serves
  // with, its Machine.tls_public_key (SPKI DER). Devices pin that key and
  // refuse an address outside Tailscale's ranges; the request's signature is
  // what makes them the asking machine's.
  string answer_address = 15;
  bytes answer_tls_public_key = 16;
}

// A device's answer, the payload of a Signed by that device's signing key.
// A plain denial with no reply may instead be sent unsigned over a device's
// own connection (see AnswerUpload), so Deny needs no Face ID or Touch ID.
message Answer {
  string domain = 1;               // "agentkeyring.answer.v2"
  bytes request_sha256 = 2;        // SHA-256 of the exact Request bytes.
  Choice choice = 3;
  int64 decided_unix_seconds = 4;
  int64 not_after_unix_seconds = 5;  // Approve: at most decided + 1800.
  string reply = 6;                // Deny: the person's words to the agent.
  bytes delivery_sha256 = 7;       // Approve: SHA-256 of Delivery.ciphertext.
}

enum Choice {
  CHOICE_UNSPECIFIED = 0;
  CHOICE_APPROVE = 1;
  CHOICE_DENY = 2;
}

// The approved login, sealed to the asking machine's receiving key.
// info = "agentkeyring.delivery.v2"; aad = Answer.request_sha256
// plaintext = serialized DeliveryContents.
message Delivery {
  bytes encapsulated_key = 1;
  bytes ciphertext = 2;
}

message DeliveryContents {
  string request_id = 1;
  string login_id = 2;
  repeated string sites = 3;       // The command refuses any other site.
  string username = 4;
  string password = 5;
  // One code per time step until not_after. The seed never leaves the device.
  repeated TimedCode one_time_codes = 6;
  int64 not_after_unix_seconds = 7;
}

message TimedCode {
  int64 valid_from_unix_seconds = 1;
  int64 valid_until_unix_seconds = 2;
  string code = 3;
}

// ---- What the asking machine sees ------------------------------------------

message Lease {
  string request_id = 1;
  string login_id = 2;
  LeaseState state = 3;
  int64 answer_by_unix_seconds = 4;
  int64 not_after_unix_seconds = 5;  // Set once approved.
  string answered_by = 6;            // Device.label, once answered.
  string reply = 7;                  // Display only; show the words from collect's signed answer.
  int64 retry_not_before_unix_seconds = 8;  // A denial holds the login off: 1, 5, then 15 minutes in a row.
  string ended_by = 9;               // Device.label when a device ended an approval early (Stop).
  bool automatic = 10;               // Granted at once by the login's Automatic rule.
  // While it waits, how far it has got, for the screens to say truthfully:
  int64 pushed_unix_seconds = 11;    // Apple accepted the push for it.
  int64 arrived_unix_seconds = 12;   // A device said it arrived (Arrival).
  string arrived_on = 13;            // That device's label.
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_WAITING = 1;         // Asked, not yet answered.
  LEASE_STATE_APPROVED = 2;        // Collect the delivery.
  LEASE_STATE_DENIED = 3;
  LEASE_STATE_UNANSWERED = 4;      // Nobody answered by answer_by.
  LEASE_STATE_ENDED = 5;           // The agent said it was done, 30 minutes passed, or a device stopped it (ended_by).
  LEASE_STATE_CANCELLED = 6;       // The agent stopped asking.
}

// Everything the asking machine needs to check an answer itself: an approval,
// to open its delivery, or a denial with words, to show them as signed.
message Approval {
  bytes request = 1;               // The exact Request bytes.
  Signed answer = 2;               // Verify against the machine's own Members.
  Delivery delivery = 3;           // Approvals only.
}

// ---- What a device is given -------------------------------------------------

// One request for one device: on its watch_work stream, from get_work, and
// sealed in the push that wakes it. For the Watch this is everything it needs,
// beside the Members and Catalogue the iPhone keeps in step on it.
message Work {
  bytes request = 1;               // The exact Request bytes.
  // The asking machine's signature over request, by its TLS key. Empty only
  // for a device's own test request.
  bytes request_signature = 6;
  SealedLogin sealed_login = 2;    // This login, sealed to this device. Absent if it may not approve it.
  // Set once the request has ended: answered here or elsewhere, or no answer
  // in time. Show the outcome and clear the request.
  Lease outcome = 3;
  // The login as the relay's catalogue lists it. Unsigned here: devices show
  // and check the login from their own signed catalogue.
  Login login = 4;
  reserved 5;                      // Rule proposals: cut with the fourth rule.
}

// The push. Apple carries nothing readable about a request. The asking machine sends:
//   aps.alert            {"title": "Agent Keyring", "body": "A request is waiting."}
//   aps.category         "REQUEST"
//   aps.interruption-level  "time-sensitive"
//   aps.mutable-content  1
//   aps.thread-id        the request id
//   akr                  base64 of a serialized Notice
// with the header apns-collapse-id set to the request id, so the push for the
// outcome replaces the one for the request. The app's notification service
// extension opens the Notice with the device's notice key and writes the
// alert from the Work in it; one push goes to each device.
// info = "agentkeyring.notice.v2"; aad = the device's Device.key_id UTF-8
// plaintext = serialized Work.
message Notice {
  bytes encapsulated_key = 1;
  bytes ciphertext = 2;
}

// ---- The relay's methods ---------------------------------------------------

message RelayRequest {
  reserved 1, 7, 23;               // Unsigned asks, use reports, rule proposals.
  oneof method {
    // Asking machines.
    Signed ask_signed = 26;        // A Request, signed by this machine's TLS key; signer_key_id is its machine_id. Returns Lease.
    RequestReference watch = 2;            // Streams Lease until it is final.
    RequestReference collect = 3;          // Returns Approval once approved, or denied with words.
    RequestReference end = 4;              // Done with it, or stop asking.
    FindRequest find = 5;                  // Returns FindResult from the catalogue.
    Empty automatic_logins = 6;            // Returns SealedLogins sealed to this machine.
    // Devices (by TLS key) and machines alike.
    Empty members = 8;                     // Returns Signed (Members).
    Empty catalogue = 9;                   // Returns Signed (Catalogue).
    // Devices.
    Empty watch_work = 10;                 // Streams Work: the waiting ones, then each new one or answer.
    RequestReference get_work = 11;        // Returns Work for this device.
    AnswerUpload answer = 12;
    PushRegistration register_push = 13;
    Signed publish_members = 14;
    Signed publish_catalogue = 15;
    SealedLogins publish_sealed_logins = 16;  // Adds or replaces each copy given; see SealedLogins.
    Empty sealed_logins = 17;              // Returns SealedLogins sealed to this device.
    // Joining: a machine or device not yet in Members. Streams JoinStatus.
    JoinRequest join = 18;
    Empty pending_joins = 19;              // Devices: returns PendingJoins.
    // Devices: a request with no login, for this device or (from its
    // iPhone) its Apple Watch, pushed like any other. Streams Lease until it
    // is answered or unanswered.
    TestRequest test_request = 20;
    Signed report_self_test = 21;          // Devices: SelfTestReport, signed by the reply key.
    Empty self_tests = 22;                 // Devices and machines: returns SelfTests.
    // Devices and machines: every Members revision after this one, oldest
    // first, so each can be checked against the one before. Returns
    // MembersChain.
    uint64 members_since = 24;
    // The inviting device, joined or not: refuses a machine's join. Returns Done.
    JoinRefusal refuse_join = 25;
    // Devices: the device's recent log (DeviceLog), signed by its reply key.
    // The relay keeps the latest from each device. Returns Done.
    Signed report_log = 27;
    // Devices and machines: the relay's own recent lines and each device's
    // latest log, merged in time order. Returns Logs.
    LogsRequest logs = 28;
    // A request reached this device (Arrival): signed by the device's reply
    // key, or unsigned with push_token_sha256, which a locked iPhone's
    // notification extension can give. A timing note that grants nothing.
    // Devices may also post the same bytes to "POST /v2/arrived". Returns Done.
    Signed arrived = 29;
    // From the relay's own computer only, while it has no members: the
    // one-time secret our app there leaves in iCloud Keychain (RelayOffer).
    // Returns SetupOffer.
    Empty setup_offer = 30;
  }
}

// One line per thing a device did, and why, with no secrets and no site or
// account names: "<UTC time, ms, ISO 8601> <device> <part> <event> key=value ...".
message DeviceLog {
  string domain = 1;               // "agentkeyring.log.v2"
  string device_key_id = 2;
  repeated string lines = 3;       // Oldest first; the relay keeps the last 1,000.
}

message Arrival {
  string domain = 1;               // "agentkeyring.arrival.v2"
  string request_id = 2;
  string device_key_id = 3;
  int64 arrived_unix_seconds = 4;
  // For an unsigned Arrival: SHA-256 of the push address the request was sent
  // to, which only that device and the asking machine know.
  bytes push_token_sha256 = 5;
}

message SetupOffer {
  bytes secret = 1;                // 32 random bytes; the relay keeps it until its first members list.
  bytes relay_tls_public_key = 2;  // SPKI DER.
}

// What our app on the computer that stays on leaves in iCloud Keychain, so a
// Mac on the same Apple Account offers "Connect to Mac mini?" with nothing typed.
message RelayOffer {
  string relay_host = 1;
  uint32 relay_port = 2;
  bytes relay_tls_public_key = 3;  // SPKI DER, pinned on first contact.
  bytes secret = 4;                // SetupOffer.secret.
  string label = 5;                // The computer as macOS names it, e.g. "Mac mini".
}

// What Apple needs to accept a push from us: the ES256 key of the Apple
// developer team that signs the apps.
message PushCredential {
  string team_id = 1;
  string key_id = 2;
  bytes private_key = 3;           // PKCS#8 DER, P-256.
}

// A PushCredential sealed to one machine's receiving key.
// info = "agentkeyring.push-credential.v2"; aad = opener_id UTF-8
message SealedPushCredential {
  string opener_id = 1;            // Machine.machine_id.
  bytes encapsulated_key = 2;
  bytes ciphertext = 3;
}

message LogsRequest {
  int64 since_unix_seconds = 1;    // 0: all it has.
  string request_id = 2;           // Only lines that name this request.
}

message Logs {
  repeated string lines = 1;       // Time order.
}

message RelayResponse {
  oneof result {
    Lease lease = 1;
    Approval approval = 2;
    FindResult find = 3;
    SealedLogins sealed_logins = 4;
    Signed signed = 5;
    Work work = 6;
    JoinStatus join = 7;
    PendingJoins pending_joins = 8;
    Empty done = 9;
    Error error = 10;
    SelfTests self_tests = 12;
    MembersChain members_chain = 13;
    Changes changes = 14;
    Logs logs = 15;
    SetupOffer setup_offer = 16;
  }
  bool end_of_stream = 11;
}

message Empty {}

// The practice request (test_request). Empty for the calling device's own; an
// iPhone names its Apple Watch, which answers it with a signed Answer like
// any other.
message TestRequest {
  string for_device_key_id = 1;
  // Chosen by the asker, 32 hex digits, and saved: the same id again rejoins
  // that practice request instead of making another. While one waits for a
  // device, a new id gets the waiting one: at most one per device.
  string request_id = 2;
}

message RequestReference {
  string request_id = 1;
  // With end, from the machine that asked: it answered the request itself (a
  // Mac's own agents), "approved" or "denied", so the devices show that.
  string answered_here = 2;
}

message FindRequest {
  string query = 1;                // Words matched against title, sites and account.
}

message FindResult {
  repeated Login logins = 1;
}

message SealedLogins {
  repeated SealedLogin logins = 1;
  // In publish_sealed_logins: openers whose every copy is replaced, even by
  // none (a machine whose last Automatic login became Ask).
  repeated string cleared_openers = 2;
  // In publish_sealed_logins: logins no longer Automatic. Every machine's
  // copy of each is removed; devices' copies stay.
  repeated string withdrawn_login_ids = 3;
}

// Sent by the device that answered.
// ---- Direct: no relay ------------------------------------------------------
//
// Every computer that asks serves a door: HTTPS on its tailnet address, port
// 17446, with its own TLS key (Machine.tls_public_key). The Mac's door is open
// whenever the app runs; a command's door is held by whichever of that
// computer's command processes binds the port first, and every waiting process
// tries to bind it once a second, so another takes over within a second when
// the holder exits. A device whose POST cannot connect retries for 30 seconds.
//
// On every door, for that computer's own requests:
//   POST /v2/answer, POST /v2/arrived: below.
//   POST /v2/end      body: Signed EndRequest (Stop). Replies 200 with the Lease.
//
// On the Mac's door only. These need a TLS client certificate: a member's TLS
// key, or for /v2/join the key the JoinRequest names.
//   POST /v2/join              body: JoinRequest. Replies 200 with JoinStatus at
//                              once if decided, else after up to 25 seconds
//                              still WAITING; post the same request again to go
//                              on waiting. A join expires 10 minutes after it
//                              was first asked, connected or not.
//   POST /v2/join/withdraw     body: JoinRequest, from the same key. Replies 200.
//   GET  /v2/rev               Replies Revisions.
//   GET  /v2/bundle            Replies Bundle for the caller.
//   POST /v2/push-registration body: Signed PushRegistration.
//   POST /v2/copies            body: SealedLogins: the Apple Watch's copies,
//                              made by its iPhone.
//   POST /v2/catalogue, /v2/members  body: Signed: a change made on the iPhone.
//   POST /v2/practice          body: Signed PracticeAsk. Replies 200 with the
//                              practice request's id; the Mac pushes it.
//   POST /v2/log               body: Signed DeviceLog.
//   GET  /v2/logs?since=SECONDS  Replies Logs: the Mac's and devices' lines.
//   POST /v2/complaint         body: Complaint, from a computer. Replies 200.
//   GET  /v2/complaints?since=SECONDS  Replies Complaints.
//
// The Mac tells the iPhone something changed with a silent push:
//   {"aps": {"content-available": 1}, "rev": {"members": N, "catalogue": N, "copies": N}}
// and the iPhone fetches /v2/bundle. Nothing depends on reaching the iPhone.
//
// The answer door. The asking machine serves HTTPS at Request.answer_address
// while its request waits, with the key in Request.answer_tls_public_key:
//   POST /v2/answer   body: AnswerUpload. Replies 200 with the request's Lease
//                     once the answer is taken, or with the Lease that already
//                     ended it (the first answer wins); 403 with a sentence if
//                     the answer is refused (unknown or removed device, a
//                     changed request).
//   POST /v2/arrived  body: Signed Arrival. Replies 200.
// A plain denial (deny_request_id) is taken from anyone who knows the request
// id, which only the devices' sealed pushes carry; it grants nothing.
// The asking machine sends the pushes itself, with the push credential
// (push_credential) and each device's push address (ask_targets).
message AnswerUpload {
  // Approve: signed with a device's signing key. Deny with words: with its
  // signing key or its reply key.
  Signed answer = 1;
  Delivery delivery = 2;           // Approve only.
  // Plain denial with no words, unsigned, from a device's own connection.
  // Grants nothing. The Watch always signs, with its reply key and no words.
  string deny_request_id = 3;
}

// Signed by the device's reply key, or for its Apple Watch by the iPhone's,
// so every computer that asks can check where it pushes.
message PushRegistration {
  string device_key_id = 1;        // The iPhone registers its Watch's token too.
  bytes apns_token = 2;
  string apns_topic = 3;           // The app's bundle identifier.
  bool apns_production = 4;        // Must match how the app was signed.
  bytes notice_public_key = 5;     // X9.63 uncompressed. Pushes are sealed to it.
  string domain = 6;               // "agentkeyring.push.v2"
  int64 registered_unix_seconds = 7;  // The newest registration for a device wins.
}

// Stop: a device ends an approved request early. Signed by its reply key.
message EndRequest {
  string domain = 1;               // "agentkeyring.end.v2"
  string request_id = 2;
  string device_key_id = 3;
  int64 ended_unix_seconds = 4;
}

// A device asks the Mac for a practice request for itself or its Apple
// Watch. Signed by its reply key.
message PracticeAsk {
  string domain = 1;               // "agentkeyring.practice.v2"
  string for_device_key_id = 2;
  string request_id = 3;           // Chosen by the device and saved: the same id rejoins.
}

// An agent's report that Agent Keyring was annoying, confusing or broken
// (`agent-keyring complain`). Never a password or any secret. Kept on the
// Mac for whoever builds the product; shown on no screen. A computer that
// cannot reach the Mac keeps it and sends it at the next contact.
message Complaint {
  string domain = 1;               // "agentkeyring.complaint.v2"
  int64 at_unix_seconds = 2;
  string computer = 3;             // The computer's label in Members.
  string version = 4;              // The command's or app's version.
  string command = 5;              // What the agent was running, as it typed it.
  string thread = 6;               // The agent's thread or session, if it has one.
  string summary = 7;              // One line.
  string detail = 8;               // Anything more, from standard input.
}

message Complaints {
  repeated Complaint complaints = 1;  // Oldest first.
}

// How new a computer's lists are, to fetch only what changed.
message Revisions {
  uint64 members = 1;
  uint64 catalogue = 2;
  uint64 copies = 3;               // Rises whenever any sealed copy is added or removed.
}

// Everything a device or computer keeps, for it alone. Each part is checked
// on its own: the lists by their signatures and revisions, each copy by its
// signer and the catalogue's version.
message Bundle {
  Signed members = 1;
  Signed catalogue = 2;
  repeated Signed push_registrations = 3;
  // To the iPhone: its own copy of every password that is not Blocked.
  // To a computer: the Apple Watch's copies, which it puts in its pushes, and
  // its own copies of the passwords Automatic for it.
  repeated SealedLogin copies = 4;
  Revisions revisions = 5;
}

message JoinRequest {
  oneof joining {
    Machine machine = 1;           // machine_id and keys of the joining machine.
    Device device = 2;             // A device; the iPhone sends one for its Watch.
  }
  // HMAC-SHA256 under JoinInvite.secret over the joiner's keys, each part a
  // 4-byte big-endian length then its bytes:
  //   a machine: "agentkeyring.join.v2", "machine", label, machine_id,
  //              tls_public_key, receiving_public_key
  //   a device:  "agentkeyring.join.v2", "device", label, key_id, kind as a
  //              decimal number, signing_public_key, opening_public_key,
  //              tls_public_key, reply_key_id, reply_public_key
  // Strings as UTF-8. A device shows only a join whose proof checks against
  // an invitation it issued; the relay cannot make one.
  bytes proof = 3;
  // A machine: SHA-256 of its refusal key, HMAC-SHA256 under
  // JoinInvite.secret over "agentkeyring.refusal.v2", "key", machine_id
  // (each part length-prefixed as in proof). Only the inviter can refuse
  // the join, by sending that key; empty means it cannot be refused.
  bytes refusal_key_sha256 = 4;
}

// The inviting device refuses a machine's join, with words for the agent
// waiting on it. The relay takes it only if SHA-256(key) is the join's
// refusal_key_sha256, and ends the join with JOIN_STATE_REFUSED and this.
// The joiner shows the words only if reply_proof is HMAC-SHA256 under
// JoinInvite.secret over "agentkeyring.refusal.v2", "reply", machine_id,
// reply: the relay sees the key but never the secret, so it cannot change
// them.
message JoinRefusal {
  string joiner_id = 1;            // Machine.machine_id.
  bytes key = 2;
  string reply = 3;
  bytes reply_proof = 4;
}

// An invitation from an approving device. The Mac keeps the current one in
// iCloud Keychain for the owner's new iPhone (a synchronizable generic
// password: access group "7M8BR7R488.com.joshpalmer.AgentKeyring.shared",
// service "com.joshpalmer.AgentKeyring.invitation", account "relay", value
// this message serialized), and gives it to an agent setting up a machine as
// "agentkeyring://join?invite=" followed by this message in base64url. Each
// secret admits one joiner; the inviting device then issues a new one. From
// the start of the Mac's first run until a computer that stays on exists, the
// item holds only inviter_key_id and inviter_label: no relay and no secret.
// So no item means no Mac yet; a name only means the Mac is set up but has no
// computer that stays on yet; a full one is an invitation to join.
message JoinInvite {
  string relay_host = 1;           // The relay: goes once nothing reads it.
  uint32 relay_port = 2;
  bytes relay_tls_sha256 = 3;      // SHA-256 of the relay's TLS public key (SPKI).
  string inviter_key_id = 4;       // The inviting device's key id: Members must be signed by it.
  bytes secret = 5;                // 32 random bytes.
  int64 expires_unix_seconds = 6;
  string inviter_label = 7;        // The inviting device as he named it, e.g. "MacBook Pro".
  // The inviting Mac's door, joined directly. The item in iCloud Keychain
  // holds all of these, with a secret, whenever the Mac app runs.
  string door_host = 8;            // The Mac's Tailscale IP address, read from Tailscale when written: never a name.
  uint32 door_port = 9;            // 17446.
  bytes door_tls_public_key = 10;  // The Mac's Machine.tls_public_key, SPKI DER: pin it.
}

// What a device found when it tested itself, the payload of a Signed by its
// reply key. The relay keeps the latest per device and logs it.
message SelfTestReport {
  string domain = 1;               // "agentkeyring.selftest.v2"
  string device_key_id = 2;
  int64 tested_unix_seconds = 3;
  repeated SelfTestCheck checks = 4;   // Also the device's setup checklist, ticked from what it can see.
  repeated JourneyStep journey = 5;    // From the Mac only: the steps for the devices he chose, in order.
  JourneyStep step = 6;                // Where this device is in its first run.
  bool finished = 7;                   // This device's first run is done.
}

// The one journey of first run, the same list on every device. The Mac picks
// the steps from the devices he chose; each device reports where it is.
enum JourneyStep {
  JOURNEY_STEP_UNSPECIFIED = 0;
  JOURNEY_STEP_WELCOME = 1;
  JOURNEY_STEP_CHOOSE_DEVICES = 2;
  JOURNEY_STEP_PRACTICE = 3;
  JOURNEY_STEP_PASSWORDS = 4;
  JOURNEY_STEP_AGENTS = 5;
  JOURNEY_STEP_ALWAYS_ON = 6;
  JOURNEY_STEP_IPHONE = 7;
  JOURNEY_STEP_WATCH = 8;
  JOURNEY_STEP_COMPUTERS = 9;
  JOURNEY_STEP_TRY_DEVICES = 10;
  JOURNEY_STEP_READY = 11;
}

message SelfTestCheck {
  string name = 1;                 // For example "notifications" or "practice".
  bool passed = 2;
  string error = 3;                // When it failed: the error, in words.
}

message MembersChain {
  repeated Signed revisions = 1;   // Oldest first.
}

message SelfTests {
  repeated Signed reports = 1;
}

message JoinStatus {
  JoinState state = 1;
  // Approved: the Members that lists the joiner. Check it is signed and lists
  // exactly the keys sent, then pin it and its relay key.
  Signed members = 2;
  JoinRefusal refusal = 3;         // Refused: the inviter's words, if its proof checks.
  // Approved, to a computer: Apple's push credential, sealed to its receiving key.
  SealedPushCredential push_credential = 4;
}

enum JoinState {
  JOIN_STATE_UNSPECIFIED = 0;
  JOIN_STATE_WAITING = 1;          // Shown on the devices; nobody has answered.
  JOIN_STATE_APPROVED = 2;
  JOIN_STATE_REFUSED = 3;          // The inviter refused it (refuse_join).
  JOIN_STATE_EXPIRED = 4;          // Ten minutes passed.
  JOIN_STATE_WITHDRAWN = 5;        // The joiner cancelled, or a second joiner used the same invitation.
}

message PendingJoins {
  repeated PendingJoin joins = 1;
}

// On watch_work, beside each Work: sent when the stream opens, whenever one of
// these changes, and at least every 30 seconds, so a device notices a dead
// connection and never polls. It names revisions only; the device fetches the
// signed documents and checks them itself.
message Changes {
  uint64 members_revision = 1;
  uint64 catalogue_revision = 2;
  repeated PendingJoin pending_joins = 3;  // To a Mac only: computers and devices waiting to join.
  uint64 reports_revision = 4;     // Rises when any device's status report changes; fetch self_tests.
  uint32 sealed_for_you = 5;       // Sealed copies held for this device; with the catalogue's count, progress while a new device is filled.
}

message PendingJoin {
  JoinRequest request = 1;
  string tailscale_node_name = 2;  // From the relay's Tailscale lookup of the connection.
  int64 asked_unix_seconds = 3;
}

message Error {
  ErrorCode code = 1;
  string message = 2;              // Safe text, never a secret.
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_NOT_ALLOWED = 2;      // Unknown key, blocked login, or not this caller's.
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_CONFLICT = 4;         // Already answered, or a stale revision.
  ERROR_CODE_HELD_OFF = 5;         // Denied a moment ago; the message says until when, and his words.
  ERROR_CODE_UNAVAILABLE = 6;
}
