// Written by AI on 2026.11.18 by model claude opus 5.5; the relay cut on
// 2026.11.24 by the same model; Apple Watch's own copies, grants, update
// mailboxes and device practice the same day; the doors cut on 2026.11.24 by
// the same model.
//
// Agent Keyring, version 2: sealed logins, and how they pass between the
// computers that ask and the devices that approve.
//
// Each login's secret is sealed separately to the opening key of each device
// that may approve it (iPhone, Watch, MacBook), and to each machine allowed to
// use it with no question (Automatic). Site and account stay readable in the
// catalogue. Approving means a device opens the one sealed login and seals it
// again for the machine that asked, valid for 30 minutes at most. Whatever
// carries these (a box, iCloud, a push) can open nothing.
//
// Keys. Every key is P-256. A device holds two keys in its Secure Enclave,
// usable only after Face ID, Touch ID, or (Watch) while unlocked on the wrist:
// a signing key, which signs approvals and the documents below, and an opening
// key, to which logins are sealed. One approval unlocks both. It also holds two
// keys usable whenever it is unlocked, with no face or finger: a reply key,
// which signs only denials with words (iOS hands a typed reply to the app where
// Face ID cannot be shown), and a notice key, to which the asking machine seals
// what a push shows. A machine holds a software receiving key, to which
// approvals are sealed. Devices other than the Watch, and machines, also hold a
// key named tls_public_key, from when it served TLS: a machine signs its
// requests with it. Key ids are lowercase hex SHA-256 of the public key bytes
// named below.
//
// Signatures. ECDSA P-256 with SHA-256, DER encoded, over the exact payload
// bytes in Signed. Verifiers parse those bytes; nobody re-encodes them.
//
// Sealing. HPKE (RFC 9180) base mode, DHKEM(P-256, HKDF-SHA256), HKDF-SHA256,
// AES-256-GCM. CryptoKit: HPKE.Ciphersuite.P256_SHA256_AES_GCM_256. Go:
// crypto/hpke. The info and associated data are given with each sealed message.

syntax = "proto3";

package agentkeyring.v2;

option go_package = "github.com/opentrawl/agent-keyring/gen/go/agentkeyring/v2;agentkeyringv2";

// ---- Signed documents ----------------------------------------------------

// The one envelope for everything signed. The payload's own domain field says
// what it is; a verifier refuses a payload whose domain it did not expect.
message Signed {
  bytes payload = 1;
  bytes signature = 2;
  // Device.key_id, when signed with the device's signing key; or Device.reply_key_id,
  // when signed with its reply key, which is valid only on an Answer that denies.
  string signer_key_id = 3;
}

// Who may approve and who may ask. Revision 1 is signed by a device it lists.
// Revision n+1 is valid only if signed by a device listed in the revision the
// verifier already holds, with its signing key. Any device may sign: Josh
// removes a lost MacBook from his iPhone. Verifiers keep the highest valid
// revision and refuse a lower one.
message Members {
  string domain = 1;  // "agentkeyring.members.v2"
  uint64 revision = 2;
  repeated Device devices = 3;
  repeated Machine machines = 4;
  reserved 5, 6, 7;                // The relay's key, its machine and its setup proof: cut with the relay.
  reserved "relay_tls_public_key", "relay_machine_id", "setup_proof";
}

message Device {
  string key_id = 1;               // SHA-256 of signing_public_key.
  DeviceKind kind = 2;
  string label = 3;                // As the person named it, e.g. "MacBook Pro".
  bytes signing_public_key = 4;    // X9.63 uncompressed.
  bytes opening_public_key = 5;    // X9.63 uncompressed. Logins are sealed to it.
  bytes tls_public_key = 6;        // SPKI DER. Empty for the Watch.
  string reply_key_id = 7;         // SHA-256 of reply_public_key.
  bytes reply_public_key = 8;      // X9.63 uncompressed. Signs only denials with words.
  bytes notice_public_key = 9;     // X9.63 uncompressed. Cloud metadata and pushes are sealed to it.
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_MAC = 1;
  DEVICE_KIND_IPHONE = 2;
  DEVICE_KIND_WATCH = 3;
}

message Machine {
  string machine_id = 1;           // SHA-256 of tls_public_key.
  string label = 2;                // e.g. "Mac mini".
  bytes tls_public_key = 3;        // SPKI DER.
  bytes receiving_public_key = 4;  // X9.63 uncompressed. Approvals are sealed to it.
  reserved 5;                      // Every machine may hold Automatic logins now.
  reserved "automatic_allowed";
}

// The logins and their rules: names readable, secrets never. Signed by any
// device in the current Members, with its signing key. Same revision rule as
// Members: machines and devices keep the highest revision they have seen.
message Catalogue {
  string domain = 1;  // "agentkeyring.catalogue.v2"
  uint64 revision = 2;
  repeated Login logins = 3;
  int64 imported_unix_seconds = 4;
}

message Login {
  string login_id = 1;             // Stable across imports.
  string title = 2;
  repeated string sites = 3;       // Saved sites; the delivery is limited to these.
  string account = 4;
  bool has_one_time_code = 5;
  Rule rule = 6;
  reserved 7;                      // Approval on the iPhone or Watch only: cut.
  // The version of every sealed copy of this login (SealedLogin.version).
  // Whoever publishes a catalogue carries it over unchanged; only a new import
  // of the secret changes it. Openers refuse a copy of another version.
  // 0: no device holds its secret (it was deleted when the login was
  // Blocked); it comes back only with the next export from Passwords.
  uint64 version = 8;
  // When the rule was last set, in Unix milliseconds, and by which device
  // (Device.key_id). Every device keeps, for each login, the rule with the
  // latest time, the higher key id breaking a tie, so rule changes made on
  // two devices at once end the same on both. 0 for a rule set before these
  // were kept: any rule set since wins over it.
  int64 rule_updated_unix_ms = 9;
  string rule_actor = 10;
}

enum Rule {
  RULE_UNSPECIFIED = 0;
  RULE_ASK = 1;
  RULE_AUTOMATIC = 2;              // Also sealed to every machine in Members.
  RULE_BLOCKED = 3;                // Devices refuse to open it for anyone.
}

// ---- Sealed logins ---------------------------------------------------------

// One login sealed to one key: a device's opening key, or a machine's
// receiving key for an Automatic login.
// info = "agentkeyring.login.v2"
// aad  = uint32 BE length || opener_id UTF-8 || uint32 BE length || login_id UTF-8
// plaintext = serialized LoginSecret, whose login_id must equal login_id here.
message SealedLogin {
  string login_id = 1;
  string opener_id = 2;            // Device.key_id or Machine.machine_id.
  bytes encapsulated_key = 3;
  bytes ciphertext = 4;
  // The device that sealed it, by its reply key (no Face ID or Touch ID), so
  // whatever carries it can neither forge a copy nor pass one off as another login's:
  // ECDSA P-256 SHA-256, DER, over "agentkeyring.sealed.v2" and the
  // length-prefixed login_id, opener_id, encapsulated_key and ciphertext,
  // then version as 8 bytes big-endian. Openers check it against a device in
  // their Members before opening.
  string signer_key_id = 5;        // Device.reply_key_id.
  bytes signature = 6;
  // When the secret was imported, in Unix nanoseconds. Resealing keeps it, so
  // no carrier can serve an older copy: it must equal the catalogue's Login.version.
  uint64 version = 7;
}

message LoginSecret {
  string login_id = 1;
  string username = 2;
  string password = 3;
  bytes totp_seed = 4;             // Empty when the login has no one-time code.
  int32 totp_period_seconds = 5;   // Default 30.
  int32 totp_digits = 6;           // Default 6.
  string totp_algorithm = 7;       // "SHA1" (default), "SHA256" or "SHA512".
  // What the login was sealed as. Openers compare these and username with the
  // login they show or deliver for (the signed Catalogue's Login, or the Mac's
  // own list) and refuse a copy that does not match.
  string title = 8;
  repeated string sites = 9;
}

// ---- Requests and answers --------------------------------------------------
// Written and signed by the asking machine with its tls_public_key's private key (SignedRequestEnvelope.request_signature).
// Devices check the signature against the machine their own Members lists as
// machine_id, show what they parse from these exact bytes, check the login
// against their own catalogue, and answer over them. A request waits at most
// 10 minutes; its reason is at most 400 bytes and its agent, project and task
// at most 100 each, so that a SignedRequestEnvelope still fits in a push.
message Request {
  string domain = 1;               // "agentkeyring.request.v2"
  string request_id = 2;           // Chosen by the asking machine: 16 random bytes, hex.
  string login_id = 3;
  string machine_id = 4;           // The machine that signed it.
  reserved 5, 6;                   // Purpose and program: one approval covers fill and read.
  string reason = 7;               // The agent's own words.
  string agent = 8;                // The agent's claim, e.g. "Codex".
  string project = 9;              // The agent's claim: its Git repository's name.
  string task = 10;                // The agent's grouping of requests into one job.
  int64 asked_unix_seconds = 11;
  int64 answer_by_unix_seconds = 12;  // After this the request is unanswered.
  // A practice request: it names no login, goes only to this device, and is
  // approved by a signed Answer with no delivery. Signed like any request, by
  // the machine that made it.
  string for_device_key_id = 13;
  // The machine uses its own copy of an Automatic login, at once, for 30
  // minutes, if its signed catalogue says Automatic. Devices show it in use
  // and may stop it.
  bool automatic = 14;
  reserved 15, 16;                 // The asking machine's door and its key: cut with the doors.
  reserved "answer_address", "answer_tls_public_key";
  // Where this request's answers go, its answer box: devices PUT the
  // AnswerUpload, sealed with answer_box_key (see "Boxes"), and the asking
  // machine picks it up. Every request names one; devices refuse one that
  // does not. answer_box_url is empty for the default, https://push.opentrawl.sh.
  string answer_box_id = 17;       // 64 lowercase hex: 32 random bytes.
  bytes answer_box_key = 18;       // 32 random bytes, AES-256-GCM.
  string answer_box_url = 19;
  // A practice request a device made, with domain
  // "agentkeyring.practice-request.v2" in place of the request domain: the
  // device that made it, by Device.key_id. It is signed by that device's reply
  // key (SignedRequestEnvelope.request_signature, DER), names no login and no machine, is not
  // Automatic, names for_device_key_id and an answer box, and is approved by a
  // signed Answer with no delivery. A verifier takes a device's signature on
  // a request only in this domain and only with all of these; computers never
  // take this domain at all.
  string asker_key_id = 20;
}

// A device's answer, the payload of a Signed by that device's signing key.
// A plain denial with no reply may instead be sent unsigned (see
// AnswerUpload), so Deny needs no Face ID or Touch ID.
message Answer {
  string domain = 1;               // "agentkeyring.answer.v2"
  bytes request_sha256 = 2;        // SHA-256 of the exact Request bytes.
  Choice choice = 3;
  int64 decided_unix_seconds = 4;
  int64 not_after_unix_seconds = 5;  // Approve: at most decided + 1800.
  string reply = 6;                // Deny: the person's words to the agent.
  bytes delivery_sha256 = 7;       // Approve: SHA-256 of Delivery.ciphertext.
}

enum Choice {
  CHOICE_UNSPECIFIED = 0;
  CHOICE_APPROVE = 1;
  CHOICE_DENY = 2;
}

// The approved login, sealed to the asking machine's receiving key.
// info = "agentkeyring.delivery.v2"; aad = Answer.request_sha256
// plaintext = serialized DeliveryContents.
message Delivery {
  bytes encapsulated_key = 1;
  bytes ciphertext = 2;
}

message DeliveryContents {
  string request_id = 1;
  string login_id = 2;
  repeated string sites = 3;       // The command refuses any other site.
  string username = 4;
  string password = 5;
  // One code per time step until not_after. The seed never leaves the device.
  repeated TimedCode one_time_codes = 6;
  int64 not_after_unix_seconds = 7;
}

message TimedCode {
  int64 valid_from_unix_seconds = 1;
  int64 valid_until_unix_seconds = 2;
  string code = 3;
}

// ---- What the asking machine sees ------------------------------------------

message Lease {
  string request_id = 1;
  string login_id = 2;
  LeaseState state = 3;
  int64 answer_by_unix_seconds = 4;
  int64 not_after_unix_seconds = 5;  // Set once approved.
  string answered_by = 6;            // Device.label, once answered.
  string reply = 7;                  // Display only; show the words from the signed answer.
  int64 retry_not_before_unix_seconds = 8;  // A denial holds the login off: 1, 5, then 15 minutes in a row.
  string ended_by = 9;               // Device.label when a device ended an approval early (Stop).
  bool automatic = 10;               // Granted at once by the login's Automatic rule.
  // While it waits, how far it has got, for the screens to say truthfully:
  int64 pushed_unix_seconds = 11;    // Apple accepted the push for it.
  reserved 12, 13;                   // A device said it arrived: cut with the doors.
  reserved "arrived_unix_seconds", "arrived_on";
  int64 requested_at_unix_seconds = 14;
  int64 approved_at_unix_seconds = 15;
  int64 ended_at_unix_seconds = 16;
  // For the authority's local callers. Clear it before sending an outcome to a device.
  LeaseAuthorityContext authority_context = 17;
}

message LeaseAuthorityContext {
  string task_ref = 1;
  string reason = 2;
  // Snapshot of authorized destinations for local delivery, which can only narrow.
  repeated string sites = 3;
  Recipient recipient = 4;
  repeated string status_lines = 5;
  DeviceKind deciding_device_kind = 6;
}

message Recipient {
  string recipient_id = 1;
  string machine_label = 2;
  string client_label = 3;
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_WAITING = 1;         // Asked, not yet answered.
  LEASE_STATE_APPROVED = 2;        // Collect the delivery.
  LEASE_STATE_DENIED = 3;
  LEASE_STATE_UNANSWERED = 4;      // Nobody answered by answer_by.
  LEASE_STATE_ENDED = 5;           // The authority or a device stopped access.
  LEASE_STATE_CANCELLED = 6;       // The agent stopped asking.
  LEASE_STATE_EXPIRED = 7;         // The approval window passed.
  LEASE_STATE_RELEASED = 8;        // The agent finished using it or its computer left the keyring.
}

// Everything the asking machine needs to check an answer itself: an approval,
// to open its delivery, or a denial with words, to show them as signed.
message Approval {
  bytes request = 1;               // The exact Request bytes.
  Signed answer = 2;               // Verify against the machine's own Members.
  Delivery delivery = 3;           // Approvals only.
}

// ---- What a device is given -------------------------------------------------

// One request for one device, sealed in the push that wakes it. The Watch
// opens the login from its own copies (WatchCopies), beside the Members and
// Catalogue the iPhone keeps in step on it.
message SignedRequestEnvelope {
  bytes request = 1;               // The exact Request bytes.
  // The asking machine's signature over request, by the key Members lists as
  // its tls_public_key; for a device's own practice request, by its reply key.
  bytes request_signature = 6;
  reserved 2;                      // The Apple Watch's copy in its push: the Watch keeps its own now (WatchCopies).
  reserved "sealed_login";
  // Set once the request has ended: answered here or elsewhere, or no answer
  // in time. Show the outcome and clear the request.
  Lease outcome = 3;
  // The login as the asking machine's catalogue lists it. Unsigned here:
  // devices show and check the login from their own signed catalogue.
  Login login = 4;
  reserved 5;                      // Rule proposals: cut with the fourth rule.
}

// The push. Apple carries nothing readable about a request.
// For a waiting request to iPhone and Apple Watch (apns-push-type alert,
// priority 10, apns-collapse-id = request id, apns-expiration = answer_by):
//   aps.alert               {"title": "Agent Keyring", "body": "A request is waiting."}
//   aps.interruption-level  "time-sensitive"
//   aps.mutable-content     1
//   aps.category            "REQUEST" (iPhone) or "WATCH_REQUEST" (Watch), as fallback
//                           so a timed-out extension still routes to the approval handler
//   aps.thread-id           the request id
//   aps.sound               "default"
//   akr                     base64 of a serialized Notice
// For a waiting request to a Mac, and for Automatic starts: silent background push
// (apns-push-type background, priority 5, apns-collapse-id = request id, aps =
// {"content-available": 1, "thread-id": id}). A Mac shows waiting requests in its own panel.
// For an outcome (answered, stopped, released, cancelled, no answer):
// - To iPhone and Apple Watch: priority-10 passive collapse alert (apns-push-type alert,
//   priority 10, apns-collapse-id = request id) with aps =
//   {"alert": {"title": "Agent Keyring", "body": "Request answered."},
//    "interruption-level": "passive", "mutable-content": 1, "content-available": 1,
//    "thread-id": id} (no category), so outcome collapses are not throttled like background pushes.
// - To a Mac: silent background push (apns-push-type background, priority 5, same
//   collapse id, aps = {"content-available": 1, "thread-id": id}).
// Every push also carries top-level "id" (the request id) and "akr" (base64 Notice).
// info = "agentkeyring.notice.v2"; aad = the device's Device.key_id UTF-8
// plaintext = serialized SignedRequestEnvelope.
message Notice {
  bytes encapsulated_key = 1;
  bytes ciphertext = 2;
}

// What Apple needs to accept a push from us: the ES256 key of the Apple
// developer team that signs the apps.
message PushCredential {
  string team_id = 1;
  string key_id = 2;
  bytes private_key = 3;           // PKCS#8 DER, P-256.
}

// A PushCredential sealed to one machine's receiving key.
// info = "agentkeyring.push-credential.v2"; aad = opener_id UTF-8
message SealedPushCredential {
  string opener_id = 1;            // Machine.machine_id.
  bytes encapsulated_key = 2;
  bytes ciphertext = 3;
}

message SealedLogins {
  repeated SealedLogin logins = 1;
  // In publish_sealed_logins: openers whose every copy is replaced, even by
  // none (a machine whose last Automatic login became Ask).
  repeated string cleared_openers = 2;
  // In publish_sealed_logins: logins no longer Automatic. Every machine's
  // copy of each is removed; devices' copies stay.
  repeated string withdrawn_login_ids = 3;
}

// ---- Answers ---------------------------------------------------------------
//
// A device answers a request by putting an AnswerUpload in the request's
// answer box (see "Boxes"); the asking machine picks it up, and the first
// answer wins. A plain denial (deny_request_id) is taken from anyone who
// knows the request id and its box key, which only the devices' sealed pushes
// carry; it grants nothing. The asking machine sends the pushes itself, with
// the push credential and each device's push address.
//
// The Mac tells the iPhone something changed with a silent push
// (apns-push-type background, priority 5, apns-collapse-id "rev"):
//   {"aps": {"content-available": 1}, "rev": {"members": N, "catalogue": N, "copies": N}}
// and the iPhone reads iCloud. Nothing depends on reaching the iPhone.
message AnswerUpload {
  // Approve: signed with a device's signing key. Deny with words: with its
  // signing key or its reply key.
  Signed answer = 1;
  Delivery delivery = 2;           // Approve only.
  // Plain denial with no words, unsigned. Grants nothing. The Watch always
  // signs, with its reply key and no words.
  string deny_request_id = 3;
  // The answering device's lists, so the asking computer learns rule and
  // device changes at each answer: Members, catalogue, push registrations, a
  // Freshness, and with an approval that computer's own Automatic copies. The
  // computer checks each part as it checks one from its update mailbox.
  Bundle bundle = 4;
}

// Signed by the device's reply key, or for its Apple Watch by the iPhone's,
// so every computer that asks can check where it pushes.
message PushRegistration {
  string device_key_id = 1;        // The iPhone registers its Watch's token too.
  bytes apns_token = 2;
  string apns_topic = 3;           // The app's bundle identifier.
  bool apns_production = 4;        // Must match how the app was signed.
  bytes notice_public_key = 5;     // X9.63 uncompressed. Pushes are sealed to it.
  string domain = 6;               // "agentkeyring.push.v2"
  int64 registered_unix_seconds = 7;  // The newest registration for a device wins.
}

// Stop: a device ends an approved request early. Signed by its reply key.
message EndRequest {
  string domain = 1;               // "agentkeyring.end.v2"
  string request_id = 2;
  string device_key_id = 3;
  int64 ended_unix_seconds = 4;
}

// An agent's report that Agent Keyring was annoying, confusing or broken
// (`agent-keyring complain`). Never a password or any secret. Kept where the
// agent ran, on the Mac or in the computer's own state, for whoever builds the
// product (`agent-keyring complaints`); shown on no screen and sent nowhere.
message Complaint {
  string domain = 1;               // "agentkeyring.complaint.v2"
  int64 at_unix_seconds = 2;
  string computer = 3;             // The computer's label in Members.
  string version = 4;              // The command's or app's version.
  string command = 5;              // What the agent was running, as it typed it.
  string thread = 6;               // The agent's thread or session, if it has one.
  string summary = 7;              // One line.
  string detail = 8;               // Anything more, from standard input.
}

message Complaints {
  repeated Complaint complaints = 1;  // Oldest first.
}

// How new a device's lists are.
message Revisions {
  uint64 members = 1;
  uint64 catalogue = 2;
  uint64 copies = 3;               // Rises whenever any sealed copy is added or removed.
}

// Everything a device or computer keeps, for it alone. Each part is checked
// on its own: the lists by their signatures and revisions, each copy by its
// signer and the catalogue's version.
message Bundle {
  Signed members = 1;
  Signed catalogue = 2;
  repeated Signed push_registrations = 3;
  // To the iPhone: its own copy of every password that is not Blocked.
  // To a computer: only its own copies of the passwords Automatic for it.
  // Never another device's: Apple Watch keeps its own (WatchCopies).
  repeated SealedLogin copies = 4;
  Revisions revisions = 5;
  // Every Members revision after the one the caller holds, oldest first, so
  // each is checked against the one before (one may be signed by a device
  // the caller has not seen yet). members is the last of them.
  repeated Signed members_since = 6;
  // To a computer, from an update mailbox, an answer box or a join: a signed
  // Freshness for it. A computer uses its Automatic copies on its own only
  // until the newest valid_until it holds.
  Signed freshness = 7;
}

// A device vouches that a computer's lists were current: signed by the
// device's reply key (no Face ID or Touch ID), so a Mac or iPhone can send it
// whenever it is awake. The computer takes it only once it holds at least
// these revisions, and never further ahead than 8 days.
message Freshness {
  string domain = 1;               // "agentkeyring.fresh.v2"
  string machine_id = 2;           // The computer it is for.
  uint64 members_revision = 3;
  uint64 catalogue_revision = 4;
  int64 valid_until_unix_seconds = 5;  // At most 7 days after it was signed.
}

// A computer's update mailbox (see "Update mailboxes"), made by the device
// that approved its join. The computer is given seed and read_auth in its
// JoinStatus; write_auth stays with the devices, which share all four
// through iCloud (record kind "mailbox-" + machine_id).
message UpdateMailbox {
  string machine_id = 1;
  bytes seed = 2;                  // 32 random bytes.
  string read_auth = 3;            // 43 characters: 32 random bytes, base64url without padding.
  string write_auth = 4;           // The same; empty in a JoinStatus.
  // The relay the computer joined through, where every device writes its
  // slot (including https://push.opentrawl.sh). Never another relay: a
  // computer that runs its own keeps its updates off push.opentrawl.sh.
  string relay_url = 5;
}

// Apple Watch's own copies, which its iPhone seals or passes on from the
// other devices and sends with WatchConnectivity's transferFile, a whole
// generation at a time: the Watch keeps the newest generation it has and
// replaces every copy it held with these, so a Blocked or deleted password
// goes from the Watch with the next generation. The file's metadata carries
// "generation" too.
message WatchCopies {
  uint64 generation = 1;           // Rises with every batch the iPhone sends.
  repeated SealedLogin copies = 2;
  uint64 catalogue_revision = 3;   // Minimum signed Catalogue revision these copies belong to.
}

message JoinRequest {
  oneof joining {
    Machine machine = 1;           // machine_id and keys of the joining machine.
    Device device = 2;             // A device; the iPhone sends one for its Watch.
  }
  // HMAC-SHA256 under JoinInvite.secret over the joiner's keys, each part a
  // 4-byte big-endian length then its bytes:
  //   a machine: "agentkeyring.join.v2", "machine", label, machine_id,
  //              tls_public_key, receiving_public_key
  //   a device:  "agentkeyring.join.v2", "device", label, key_id, kind as a
  //              decimal number, signing_public_key, opening_public_key,
  //              tls_public_key, reply_key_id, reply_public_key, and
  //              notice_public_key (appended when non-empty)
  // Strings as UTF-8. A device shows only a join whose proof checks against
  // an invitation it issued; whatever carries it cannot make one.
  bytes proof = 3;
  // A machine: SHA-256 of its refusal key, HMAC-SHA256 under
  // JoinInvite.secret over "agentkeyring.refusal.v2", "key", machine_id
  // (each part length-prefixed as in proof). Only the inviter can refuse
  // the join, by sending that key; empty means it cannot be refused.
  bytes refusal_key_sha256 = 4;
  // Joining with a code: 16 random bytes the JoinStatus must carry back, so
  // an old answer from the same code cannot be passed off as this one's.
  bytes challenge = 5;
}

// The inviting device refuses a machine's join, with words for the agent
// waiting on it, which takes it only if SHA-256(key) is the join's
// refusal_key_sha256, and ends the join with JOIN_STATE_REFUSED and this.
// The joiner shows the words only if reply_proof is HMAC-SHA256 under
// JoinInvite.secret over "agentkeyring.refusal.v2", "reply", machine_id,
// reply, so whatever carries it cannot change them.
message JoinRefusal {
  string joiner_id = 1;            // Machine.machine_id.
  bytes key = 2;
  string reply = 3;
  bytes reply_proof = 4;
}

// An invitation from an approving device, kept in iCloud Keychain for the
// owner's new iPhone or Mac (a synchronizable generic password: access group
// "7M8BR7R488.com.joshpalmer.AgentKeyring.shared", service
// "com.joshpalmer.AgentKeyring.invitation", account "relay", value this
// message serialized). The joiner proves its secret in a JoinRequest it puts
// in iCloud. Each secret admits one joiner; the inviting device then issues a
// new one. No item means no Mac or iPhone yet. Computers join with a code
// instead (see "Joining with a code").
message JoinInvite {
  reserved 1, 2, 3;                // The relay's address and key: cut with the relay.
  reserved "relay_host", "relay_port", "relay_tls_sha256";
  string inviter_key_id = 4;       // The inviting device's key id: Members must be signed by it.
  bytes secret = 5;                // 32 random bytes.
  int64 expires_unix_seconds = 6;
  string inviter_label = 7;        // The inviting device as he named it, e.g. "MacBook Pro".
  reserved 8, 9, 10;               // The inviting Mac's door and its key: cut with the doors.
  reserved "door_host", "door_port", "door_tls_public_key";
}

message JoinStatus {
  JoinState state = 1;
  // Approved: the Members that lists the joiner. Check it is signed and lists
  // exactly the keys sent, then pin it.
  Signed members = 2;
  JoinRefusal refusal = 3;         // Refused: the inviter's words, if its proof checks.
  // Approved, to a computer: Apple's push credential, sealed to its receiving key.
  SealedPushCredential push_credential = 4;
  // Approved: the computer's lists and its own Automatic copies, with a Freshness.
  Bundle bundle = 5;
  // JoinRequest.challenge, carried back.
  bytes challenge = 6;
  reserved 7, 8, 9;                // The Mac's door and its key: cut with the doors.
  reserved "door_host", "door_port", "door_tls_public_key";
  // Approved: the computer's update mailbox, with no write_auth.
  UpdateMailbox mailbox = 10;
}

// ---- Boxes ---------------------------------------------------------------------
//
// A box is one encrypted message on a relay that keeps nothing else
// (https://push.opentrawl.sh, or cmd/agent-keyring-box run by anyone). The box
// id goes in a header, never the URL, so nothing that logs URLs sees it:
//   PUT    /v1/box  x-akr-box: ID, application/octet-stream, 1 byte to 256 KiB.
//          x-akr-ttl: "enrol" (600 s, the default), "grant" (2700 s) or
//          "update" (604800 s). x-akr-mode: "create" (the default: 409 if a
//          live box has the id), "replace" (403 unless the live box was put
//          with the same x-akr-write-auth) or "stop" (below).
//          x-akr-read-auth, x-akr-write-auth: optional tokens, 32 to 128
//          characters of base64url; the relay keeps only their SHA-256.
//          201 with x-akr-etag; 429 throttled.
//   GET    /v1/box  x-akr-box: ID [x-akr-read-auth]. 200 with the bytes,
//          x-akr-etag, and x-akr-stopped on a grant; 404 if missing or
//          expired; 403 if the box has a read token and this is not it. The
//          box stays.
//   DELETE /v1/box  x-akr-box: ID [x-akr-read-auth] [x-akr-if-etag]. 200
//          with the bytes and the box is gone; 404 if missing or expired; 409
//          if x-akr-if-etag is not the box's etag now (it was replaced, or is
//          already gone); 403 for a wrong read token. A grant is never deleted.
// id is 32 to 64 lowercase hex characters. The relay sees only ids, tokens'
// hashes and ciphertext. Whoever waits on a box GETs it: every 0.5 s for its
// first 15 s, every second to a minute, then every 3 s, each with up to 10%
// jitter. It saves what the box said first, then DELETEs it with the etag it
// read, so an answer cut off on the way is fetched again, not lost.
//
// Sealing a message M to box id B with key K (32 bytes):
//   M is cut into n >= 1 parts of at most 196608 bytes, and N is 16 random
//   bytes, new for each message. Part 0 goes in box B, its plaintext n as 4
//   bytes big-endian, then N, then the part. Part i > 0 goes in box lowercase
//   hex SHA-256("agentkeyring.box.part.v1" || hex(N) as ASCII || i as 4 bytes
//   big-endian), its plaintext n as 4 bytes big-endian, then the part. Each
//   part in box P is nonce (12 random bytes) || AES-256-GCM(K, nonce,
//   plaintext, aad = "agentkeyring.box.v1" || P as ASCII). Parts n-1 to 1
//   are put first, created with B's ttl and no tokens; part 0 last, as B's
//   mode and tokens say, so whoever reads part 0 finds the rest, and parts
//   of two messages in one replaced box never mix.
//
// Joining with a code. The inviter makes 16 random bytes S and shows them as
// 26 Crockford base32 characters (0-9, A-Z without I, L, O, U; the 128 bits
// most significant first, then two zero bits), in groups of four:
// XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XX. Readers ignore case, hyphens and spaces
// and read I and L as 1 and O as 0. As a link:
// "agentkeyring://join?code=" + the 26 characters, then "&relay=" + the
// relay's URL, percent-encoded, if it is not the default. From S, each
// HKDF-SHA256(ikm = S, salt = empty, L = 32) with info:
//   "agentkeyring.join.v1 request box"   join request box id, as hex
//   "agentkeyring.join.v1 request key"   its key
//   "agentkeyring.join.v1 response box"  join status box id, as hex
//   "agentkeyring.join.v1 response key"  its key
//   "agentkeyring.join.v1 proof"         the secret for JoinRequest.proof
//                                        and JoinRefusal, as JoinInvite.secret
// The joiner puts its JoinRequest in the request box and waits on the
// response box; the inviter waits on the request box, and puts one JoinStatus
// (approved with its bundle and mailbox, refused, or expired) in the response
// box. Only someone with the code can read or write either. A join box naming
// a machine already in Members with other keys is refused.
//
// Grants and Stop. Before an approval is used, the asking
// computer creates its grant: box G = lowercase hex SHA-256(
// "agentkeyring.grant.v1" || answer_box_id as ASCII), ttl "grant", mode
// "create", the request id sealed with answer_box_key, and the tokens
// base64url(HKDF-SHA256(ikm = answer_box_key, salt = empty, L = 32, info =
// "agentkeyring.grant.v1 read auth")) and the same with "... write auth".
// The relay marks it x-akr-stopped: false. Before every use (read, fill, a
// one-time code) the computer GETs G, and uses the approval only if
// x-akr-stopped is false and G opens to the request id: a Stop, a missing
// grant, a box that does not open, or no answer from the relay all refuse the
// use. Stop on any device puts the grant (409 is fine: it is there), then
// PUTs mode "stop" with the write token and the device's Signed EndRequest
// sealed with answer_box_key: the relay marks it stopped for good and keeps it
// 2700 s more. A computer that finds a Stop signed by a device in its Members
// ends the approval for good; one it cannot check still refuses the use.
//
// Update mailboxes. Every computer has an UpdateMailbox, from its join.
// Each Mac and iPhone in Members writes its own slot in it, box
// hex(HKDF-SHA256(ikm = seed, salt = empty, L = 32, info =
// "agentkeyring.mailbox.v1 slot " || the device's key_id)), sealed with key
// HKDF-SHA256(seed, info = "agentkeyring.mailbox.v1 key"), ttl "update", mode
// "replace", with the mailbox's read and write tokens. It writes there a
// Bundle whenever it signs or takes a newer Members or Catalogue, and once a
// day while awake: Members (and every revision since), the Catalogue, the
// push registrations, that computer's own Automatic copies, and a Freshness.
// A computer it removed is sent the Members that leaves it out and nothing
// else. Before find and before using an Automatic copy, the computer GETs
// each slot (giving up after 1.5 s and using what it holds), checks the
// bundle as it checks one from an answer, refuses a Catalogue of the same
// revision as the one held with other contents, and then DELETEs it with the
// etag it read. An empty slot never extends its Freshness.
//
// Relay URLs are https with a host and nothing after the path: no user,
// password, query or fragment. Redirects are not followed. Devices answer
// only at the default relay or the one set on the device. The relay can drop
// or withhold any box: that delays a computer's lists, which its Freshness
// bounds, but it cannot forge or read one.

enum JoinState {
  JOIN_STATE_UNSPECIFIED = 0;
  JOIN_STATE_WAITING = 1;          // Shown on the devices; nobody has answered.
  JOIN_STATE_APPROVED = 2;
  JOIN_STATE_REFUSED = 3;          // The inviter refused it (refuse_join).
  JOIN_STATE_EXPIRED = 4;          // Ten minutes passed.
  JOIN_STATE_WITHDRAWN = 5;        // The joiner cancelled, or a second joiner used the same invitation.
}

message PendingJoin {
  JoinRequest request = 1;
  reserved 2;                      // The relay's Tailscale lookup: cut with the relay.
  reserved "tailscale_node_name";
  int64 asked_unix_seconds = 3;
}

