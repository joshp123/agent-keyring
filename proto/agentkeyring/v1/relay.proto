// Written by AI on 2026.10.31 by Claude Opus 5.5 and GPT-6 Astra.
// The relay on the Mac mini (RFC 0005) and its approvers (RFC 0005: MacBook,
// RFC 0006: iPhone). Clients keep using the AgentKeyring service from
// agentkeyring.proto, served by the relay over mutual TLS on the tailnet.
//
// Wire: the same length-prefixed framing as agentkeyring.proto, inside TLS 1.3
// with pinned self-signed keys on both sides, one method per connection.
// RelayWireRequest/RelayWireResponse carry these methods.

syntax = "proto3";

package agentkeyring.v1;

import "agentkeyring/v1/agentkeyring.proto";
import "agentkeyring/v1/bundle.proto";

option go_package = "github.com/joshp123/agent-keyring/gen/go/agentkeyring/v1;agentkeyringv1";

// Served by the relay to enrolled approvers.
service Approvals {
  // Long-lived. First the current backlog, then new work. Reconnecting gets the
  // backlog again; an item answered elsewhere arrives as a cancellation.
  rpc WatchWork(WatchWorkRequest) returns (stream ApproverWork);
  // Approval includes SignedDecision.bundle. Store bundle, decision and lease
  // transition atomically; acknowledge a matching resend without changing it.
  rpc Decide(SignedDecision) returns (DecisionAck);
  // The rule owner's whole configuration in one signed snapshot: logins and
  // rules, enrolled machines, and who may sign Automatic decisions. Approving
  // or revoking a machine and changing a rule are each a new configuration.
  // The relay commits it and revokes affected leases in one transaction
  // (RFC 0005, "Configuration"). An exact resend is acknowledged.
  rpc PublishConfiguration(ConfigurationPublication) returns (PublishAck);
  // RFC 0008: a full replacement of the destination's login copy, signed by
  // the background MAC_DELIVERY key. Password-only refreshes need no Touch ID.
  rpc PublishCopyUpdate(SignedCopyUpdate) returns (PublishAck);
  // A pinned phone fetches only its own opaque copy. Missing returns NOT_FOUND.
  rpc GetCopyUpdate(GetCopyUpdateRequest) returns (SignedCopyUpdate);
  // Receipts authenticate durable application, never a relay's claim of delivery.
  rpc PublishUpdateReceipt(SignedUpdateReceipt) returns (PublishAck);
  rpc GetUpdateReceipts(UpdateReceiptQuery) returns (UpdateReceipts);
  // Owner's pinned TLS connection, after complete evidence is durably saved.
  // Starts completed-evidence retention; never confirms a permission change.
  rpc AcknowledgeUpdateReceipts(UpdateReceiptQuery) returns (PublishAck);
  rpc GetConfigurationUpdates(GetConfigurationUpdatesRequest) returns (ConfigurationUpdates);
  // Josh pressed "Doesn't match" or dismissed a pending enrolment. Grants
  // nothing, so unsigned; accepted only from a pinned approver connection.
  rpc DismissEnrolment(DismissEnrolmentRequest) returns (PublishAck);
  rpc RegisterPush(PushRegistration) returns (PublishAck);
  // A pinned approver adds or removes approvers (release 4 adds the iPhone).
  rpc PublishApproverKeys(SignedApproverKeySet) returns (PublishAck);
  // Public keys only, also available before pairing. Fetch over the same
  // observed/pinned relay identity used for the pairing comparison. A signed
  // configuration naming these keys delegates Automatic approval.
  rpc GetAutomaticKeys(GetAutomaticKeysRequest) returns (AutomaticKeys);
  // Lets a recipient ask again for a login before a denial's 30-minute
  // suppression ends (RFC 0004). It grants nothing by itself, so it needs no
  // signature; accepted only from a pinned approver connection.
  rpc ClearDenial(ClearDenialRequest) returns (PublishAck);
  // Josh ends a remote lease early: it becomes REVOKED and no further
  // delivery is made. It grants nothing, so it needs no signature; accepted
  // only from a pinned approver connection.
  rpc RevokeLease(LeaseReference) returns (Lease);
  // MacBook to relay: wake the iPhone for this request (RFC 0006).
  rpc EscalateToPhone(PhoneEscalation) returns (PublishAck);
  // iPhone to relay: Josh's signed answer, forwarded to the MacBook as
  // ApproverWork.phone_decision. The relay stores it until the MacBook
  // acknowledges by delivering or denying; an exact resend is acknowledged.
  rpc AnswerFromPhone(SignedPhoneDecision) returns (DecisionAck);
  // The owning Mac reports the outcome of a local lease that it escalated.
  // Display/acknowledgement only: never creates a remotely usable lease or
  // bundle. Accepted only from the same pinned MAC connection as escalation.
  rpc UpdateLocalPhoneLease(LocalPhoneLeaseUpdate) returns (DecisionAck);
}

// Served by the relay to a machine that is not yet enrolled. Reachable only
// on the tailnet. Enrolling grants the right to ask, nothing more.
service Enrolment {
  // Streams PENDING, then APPROVED once a published configuration lists this
  // machine, or DENIED if dismissed, or EXPIRED after ten minutes.
  rpc Enrol(EnrolRequest) returns (stream EnrolStatus);
  // Starts a pending pairing. First approver: setup brings the relay's code
  // over an independently trusted path (e.g. existing SSH), then compare and
  // ConfirmPairing. Later: compare with a pinned approver, which commits the
  // addition through PublishApproverKeys. Neither path activates on request.
  rpc PairApprover(PairApproverRequest) returns (stream EnrolStatus);
  // Enrolled clients: the newest approver key set, checked against the pinned
  // chain before use.
  rpc GetApproverKeys(GetApproverKeysRequest) returns (SignedApproverKeySet);
  // First approver only: commits a pairing after Josh has compared codes and
  // approved with Touch ID. Until this arrives the pairing is not active.
  rpc ConfirmPairing(SignedPairingConfirmation) returns (EnrolmentAck);
  // Every signed approver key set after from_revision, oldest first, so a
  // receiver that missed changes can walk the chain from a key it pinned.
  rpc GetApproverKeyChain(GetApproverKeyChainRequest) returns (ApproverKeyChain);
  // The current signed configuration. Receivers use it to check Automatic
  // decisions; approvers that are not the rule owner use it before deciding.
  rpc GetConfiguration(GetConfigurationRequest) returns (SignedConfiguration);
}

message WatchWorkRequest {
  string approver_key_id = 1;
}

message ApproverWork {
  oneof item {
    PendingRequest request = 1;
    PendingEnrolment enrolment = 2;
    string cancelled_request_digest_hex = 3;
    PairApproverRequest pairing = 4;
    // A remote lease's current state: every pending or active lease in the
    // backlog, then each change, so approvers can show what is in use.
    Lease lease = 5;
    SignedPhoneDecision phone_decision = 6;  // To the MacBook only.
    LocalLeaseAction local_lease_action = 7; // To the owning MacBook only.
    SignedCopyUpdate copy_update = 8; // To its destination phone only.
    TrustUpdate trust_update = 9; // Save before accepting further answers.
  }
}

// The relay serializes RequestRecord once and never changes those bytes. The
// approver displays what it parses from them, then checks login and recipient
// against its own state, never the relay's.
message PendingRequest {
  bytes record = 1;             // Serialized RequestRecord.
  // Phone work only, after escalation. The relay derives this from the
  // escalating MAC's pinned connection. The phone uses the pinned MAC label.
  string source_mac_key_id = 2;
  // Present only for a local Mac lease. It is a display copy, not a receiver
  // enrolment. Fields must agree with record. Metadata comes from the
  // current configuration.
  Lease local_lease = 3;
}

message RequestRecord {
  string lease_id = 1;
  string request_id = 2;
  string login_id = 3;
  string task_ref = 4;
  Purpose purpose = 5;
  string reason = 6;            // Agent's claim.
  string agent_label = 7;       // Agent's claim.
  string recipient_id = 8;      // Enrolled recipient the relay authenticated.
  ProgramCommand program = 9;
  int64 created_unix_seconds = 10;
  int64 pending_until_unix_seconds = 11;
  // From Tailscale WhoIs on the connection, not from the request.
  string tailscale_node_name = 12;
  string tailscale_address = 13;
  // Set when the login's rule is Automatic in the current configuration. The
  // approver still checks its own rule before approving without a prompt.
  bool automatic = 14;
}

message DecisionAck {
  bool accepted = 1;
  // True also for an exact already-accepted resend, even after the pending
  // deadline. A conflicting decision returns false and current lease state.
  // Never show "try again" for a request that is already terminal.
  string detail = 2;
  Lease lease = 3;              // Current state for a known, authorized request.
}

message EnrolRequest {
  string machine_label = 1;
  string client_label = 2;
  bytes tls_public_key = 3;      // SubjectPublicKeyInfo DER.
  bytes receiver_public_key = 4; // P-256 X9.63 uncompressed, for SealedBundle.
}

message EnrolStatus {
  EnrolState state = 1;
  // Display only. Each side computes the code itself from the pairing
  // transcript (RFC 0005, "Pairing"); a code sent by the relay is never
  // evidence of a match.
  string code = 2;
  string recipient_id = 3;
  repeated ApproverKey approver_keys = 4;  // Display; must match approver_key_set.
  bool automatic_allowed = 5;
  // PENDING: candidate current set, bound into the locally computed code.
  // APPROVED: the accepted set. Pin only after the confirmation checks in
  // RFC 0005; a relay's APPROVED flag alone establishes no trust.
  SignedApproverKeySet approver_key_set = 6;
  // Machine enrolment, APPROVED only: the configuration that lists this
  // machine with exactly this client's keys, signed by the rule owner in field 6.
  SignedConfiguration configuration = 7;
  reserved 8;
  // PairApprover: public relay keys over the very same TLS connection whose
  // SPKI the pairing transcript authenticates. Available before confirmation.
  AutomaticKeys automatic_keys = 9;
}

enum EnrolState {
  ENROL_STATE_UNSPECIFIED = 0;
  ENROL_STATE_PENDING = 1;
  ENROL_STATE_APPROVED = 2;
  ENROL_STATE_DENIED = 3;
  ENROL_STATE_EXPIRED = 4;
}

message PendingEnrolment {
  bytes record = 1;              // Serialized EnrolmentRecord.
}

message EnrolmentRecord {
  string recipient_id = 1;
  string machine_label = 2;
  string client_label = 3;
  string tailscale_node_id = 4;
  string tailscale_node_name = 5;
  repeated string tailscale_tags = 6;
  bytes tls_public_key = 7;
  bytes receiver_public_key = 8;
  string receiver_key_id = 9;
  string code = 10;
  int64 created_unix_seconds = 11;
  bytes approver_key_set_sha256 = 12; // SHA-256 of the compared key_set bytes.
}

message EnrolmentAck {
  bool accepted = 1;
  string detail = 2;
}

message ApproverKey {
  string key_id = 1;
  bytes public_key = 2;          // P-256 X9.63, signing.
  string label = 3;              // "Josh's MacBook Pro", "Josh's iPhone".
  bytes tls_public_key = 4;      // SPKI DER; authenticated alongside signing key.
  // MAC_DELIVERY has no TLS identity of its own: tls_public_key is empty.
  // A legacy unspecified role is accepted only for the already pinned Mac
  // rule-owner key. Other unspecified keys must be paired with an explicit role.
  ApproverRole role = 5;
  // PHONE only: Face ID protected P-256 X9.63 key agreement public key.
  // Optional for approval-only phones. Its copy destination ID is lowercase
  // hex SHA256 over these exact bytes. Bound into the pairing transcript.
  bytes encryption_public_key = 6;
}

enum ApproverRole {
  APPROVER_ROLE_UNSPECIFIED = 0;
  APPROVER_ROLE_MAC = 1;          // MacBook, Touch ID on every signature.
  APPROVER_ROLE_PHONE = 2;        // iPhone, Face ID on every signature.
  // MacBook key with no biometric check, usable while the Mac is awake, even
  // with the screen locked. Signs only AUTOMATIC_RULE decisions under the configuration
  // and PHONE decisions carrying a valid phone decision, and login copy updates
  // within the current configuration (RFC 0008). Never HUMAN.
  APPROVER_ROLE_MAC_DELIVERY = 3;
}

// The MacBook asks the relay to wake the iPhone for a request it has not
// answered: after Josh's delay, or at once if the Mac's screen is locked.
// For a remote lease the relay already has the record; for a request from an
// agent on the MacBook itself, `record` carries the RequestRecord bytes.
message PhoneEscalation {
  string lease_id = 1;
  bytes record = 2;
  // Present for a local lease: snapshot from the Mac's existing lease store.
  // Absent for a remote lease whose identical record is already at the relay.
  Lease local_lease = 3;
}

message LocalPhoneLeaseUpdate {
  bytes request_digest = 1;
  Lease lease = 2;              // Actual state committed by the owning Mac.
}

// Reuse the phone's existing RevokeLease/ClearDenial calls. For a local lease
// the relay queues this work until the Mac reports the resulting state through
// UpdateLocalPhoneLease. A relay acknowledgement alone does not end access.
message LocalLeaseAction {
  oneof action {
    LeaseReference revoke_lease = 1;
    ClearDenialRequest clear_denial = 2;
  }
}

// Receivers accept a new approver key set only if a currently pinned MAC key
// signed it and its revision is higher. This is how the iPhone is added in
// release 4 without re-enrolling every machine.
message SignedApproverKeySet {
  bytes key_set = 1;             // Serialized ApproverKeySet.
  bytes signature = 2;
  string signer_key_id = 3;
}

message ApproverKeySet {
  string domain = 1;             // "agentkeyring.approvers.v1".
  uint64 revision = 2;
  repeated ApproverKey keys = 3;
  // The one approver whose signed configuration is current (RFC 0006, "Rule
  // owner"). Other approvers follow it.
  string rule_owner_key_id = 4;
  // On adding an approver, binds the current configuration it must fetch.
  // Hash the exact SignedConfiguration.configuration bytes, not a re-encoding.
  uint64 configuration_revision = 5;
  bytes configuration_sha256 = 6;
  // Required on adding an approver; empty for other key-set changes.
  bytes pairing_transcript_sha256 = 7;
}

message GetApproverKeyChainRequest {
  uint64 from_revision = 1;
}

message ApproverKeyChain {
  repeated SignedApproverKeySet key_sets = 1;
}

// Code = first 16 bytes of SHA256(transcript), uppercase hex in eight groups
// of four characters, separated by spaces. Compare the entire fingerprint.
// Six decimal digits are not enough here: the relay can choose candidate keys
// and search for a matching short hash. This comparison occurs only at setup.
// Each component below has a 4-byte big-endian byte-length prefix.
// Enrol: domain "agentkeyring.enrol.v1\0", relay TLS SPKI, client TLS SPKI,
// receiver public key, current ApproverKeySet bytes.
// Pair: domain "agentkeyring.pair.v1\0", relay TLS SPKI, new approver TLS SPKI,
// new approver signing key, current ApproverKeySet bytes (empty on first pair).
// If encryption_public_key is nonempty, append it as one more length-prefixed
// component after key_set. Empty leaves the original transcript unchanged.
// Each new device uses its own keys and the relay TLS key it observed; the
// existing approver uses its pinned relay key and locally pinned key-set bytes.
// The candidate key set from EnrolStatus is not trusted until codes match and
// the signed confirmation is verified. Do not re-encode key_set for this hash.
message SignedPairingConfirmation {
  bytes confirmation = 1;        // Serialized PairingConfirmation.
  bytes signature = 2;           // By the approver signing key being paired.
  string approver_key_id = 3;
  // First pair only: revision 1, containing only this approver as rule owner,
  // signed by it and bound to the same pairing transcript. Committed with the
  // confirmation, so GetApproverKeys never needs an unsigned bootstrap set.
  SignedApproverKeySet initial_key_set = 4;
}

message PairingConfirmation {
  string domain = 1;             // "agentkeyring.pairconfirm.v1".
  bytes transcript_sha256 = 2;
  int64 confirmed_unix_seconds = 3;
}

message EnrolledMachine {
  string recipient_id = 1;
  string machine_label = 2;
  string client_label = 3;
  string tailscale_node_id = 4;
  bytes tls_public_key = 5;
  bytes receiver_public_key = 6;
  string receiver_key_id = 7;
  bool automatic_allowed = 8;
}

message GetConfigurationRequest {}

message DismissEnrolmentRequest {
  string recipient_id = 1;
}

// Signed by the rule owner after Josh confirms the change with Touch ID.
message SignedConfiguration {
  bytes configuration = 1;       // Serialized Configuration.
  bytes signature = 2;
  string approver_key_id = 3;
}

// Everything that decides who may ask for what, in one revision. A machine
// absent from `machines` is not enrolled; a login absent from `logins` cannot
// be requested. Receivers and the relay use the highest valid revision.
message Configuration {
  string domain = 1;             // "agentkeyring.configuration.v1".
  uint64 revision = 2;
  repeated Login logins = 3;     // Metadata and rules; never secrets.
  repeated LoginSource sources = 4;
  int64 mirror_refreshed_unix_seconds = 5;
  repeated EnrolledMachine machines = 6;
  // The key that may sign AUTOMATIC_RULE decisions, only for logins whose rule
  // is AUTOMATIC and machines with automatic_allowed. The relay's key for
  // unattended remote delivery; the Mac delivery key for older configurations.
  bytes automatic_signing_public_key = 7;
  string automatic_key_id = 8;
  // Relay's HPKE encryption public key, obtained through GetAutomaticKeys.
  bytes relay_encryption_public_key = 9;
  reserved 10; // Copies now have their own background signature and revision.
}

// Configuration and copy updates are distinct: only a policy change needs
// Josh's biometric check. Committing a configuration atomically prunes copies
// and revokes leases no longer allowed, before acknowledging the publication.
message ConfigurationPublication {
  SignedConfiguration configuration = 1;
  reserved 2;
}

message SignedCopyUpdate {
  bytes update = 1;              // Exact serialized CopyUpdate bytes.
  bytes signature = 2;           // ECDSA P-256 / SHA-256 DER, over update.
  string signer_key_id = 3;       // A current MAC_DELIVERY key.
}

// Full replacement, including an empty list to clear the destination's copy.
// Revision increases per destination across configuration revisions. An exact
// same-revision resend is acknowledged while its configuration is current;
// different bytes at the same revision and all older revisions are refused.
message CopyUpdate {
  string domain = 1;             // "agentkeyring.copy-update.v1".
  string destination_key_id = 2;  // AutomaticKeys.encryption_key_id for the mini.
  uint64 configuration_revision = 3;
  uint64 revision = 4;
  repeated SealedAutomaticLogin logins = 5;
}

message GetAutomaticKeysRequest {}
message GetCopyUpdateRequest {}

message AutomaticKeys {
  bytes signing_public_key = 1;     // P-256 X9.63.
  string signing_key_id = 2;
  bytes encryption_public_key = 3;  // HPKE P-256 X9.63.
  string encryption_key_id = 4;
}

// The source identity the importer already records (MirrorSourceIdentity).
// Whether Apple gives the same item the same IDs on the Mac and the iPhone is a
// device proof in RFC 0006; matching falls back as that RFC describes.
message LoginSource {
  string login_id = 1;
  bytes apple_item_id = 2;       // ASImportableItem.id.
  bytes apple_account_id = 3;    // ASImportableAccount.id.
  string exporter_identifier = 4;
}

message SealedAutomaticLogin {
  string login_id = 1;
  // Same HPKE suite as SealedBundle; info = "agentkeyring.login-copy.v1".
  // AAD = uint32 BE byte-length of destination_key_id UTF-8 || destination_key_id
  // UTF-8 || uint64 BE configuration_revision || uint64 BE revision || login_id
  // UTF-8. SealedBundle.receiver_key_id equals destination_key_id.
  // Plaintext: AutomaticLoginContents, whose login_id must match this one.
  SealedBundle sealed = 2;
}

message AutomaticLoginContents {
  string login_id = 1;
  repeated string sites = 2;
  string username = 3;
  string password = 4;
  bytes totp_seed = 5;
  int32 totp_period_seconds = 6;
  int32 totp_digits = 7;
  string totp_algorithm = 8;     // "SHA1", "SHA256", "SHA512".
}

message PairApproverRequest {
  ApproverKey key = 1;
  bytes tls_public_key = 2;       // Must equal key.tls_public_key and TLS peer key.
}

message GetApproverKeysRequest {}

message PushRegistration {
  string approver_key_id = 1;
  bytes apns_device_token = 2;
  bool apns_production = 3;      // Must match how the app was signed.
  // Unused from release 4: the MacBook runs the delay before escalating
  // (RFC 0006). Kept so the field number is not reused.
  optional uint32 escalation_delay_seconds = 4;
}

message ClearDenialRequest {
  string recipient_id = 1;
  string login_id = 2;
}

message PublishAck {
  bool accepted = 1;
  string detail = 2;
}

message RelayWireRequest {
  oneof request {
    WireRequest client = 1;      // The AgentKeyring service, unchanged.
    WatchWorkRequest watch_work = 2;
    SignedDecision decide = 3;
    ConfigurationPublication publish_configuration = 4;
    DismissEnrolmentRequest dismiss_enrolment = 5;
    GetConfigurationRequest get_configuration = 6;
    PushRegistration register_push = 7;
    EnrolRequest enrol = 8;
    SignedApproverKeySet publish_approver_keys = 9;
    PairApproverRequest pair_approver = 11;
    GetApproverKeysRequest get_approver_keys = 12;
    SignedPairingConfirmation confirm_pairing = 13;
    GetApproverKeyChainRequest get_approver_key_chain = 14;
    GetAutomaticKeysRequest get_automatic_keys = 20;
    ClearDenialRequest clear_denial = 21;
    LeaseReference revoke_lease = 22;
    PhoneEscalation escalate_to_phone = 23;
    SignedPhoneDecision answer_from_phone = 24;
    LocalPhoneLeaseUpdate update_local_phone_lease = 25;
    SignedCopyUpdate publish_copy_update = 26;
    GetCopyUpdateRequest get_copy_update = 27;
    SignedUpdateReceipt publish_update_receipt = 28;
    UpdateReceiptQuery get_update_receipts = 29;
    GetConfigurationUpdatesRequest get_configuration_updates = 30;
    UpdateReceiptQuery acknowledge_update_receipts = 31;
  }
  reserved 10, 15, 16, 17, 18, 19;
}

message RelayWireResponse {
  oneof response {
    WireResponse client = 1;
    ApproverWork work = 2;
    DecisionAck decision = 3;
    EnrolmentAck enrolment = 4;
    PublishAck publish = 5;
    EnrolStatus enrol_status = 6;
    RpcError error = 7;
    SignedApproverKeySet approver_keys = 10;
    ApproverKeyChain approver_key_chain = 11;
    SignedConfiguration configuration = 12;
    AutomaticKeys automatic_keys = 15;
    Lease lease = 16;
    SignedCopyUpdate copy_update = 17;
    UpdateReceipts update_receipts = 18;
    ConfigurationUpdates configuration_updates = 19;
    TrustUpdate trust_update = 20; // May precede a streamed client result.
  }
  bool end_of_stream = 8;
  reserved 9, 13, 14;
}

// Public changes use the existing owner signatures. Hash the payload bytes,
// not their signature wrappers; signatures may differ on an exact resend.
enum UpdateKind {
  UPDATE_KIND_UNSPECIFIED = 0;
  UPDATE_KIND_APPROVER_KEYS = 1;
  UPDATE_KIND_CONFIGURATION = 2;
}
message TrustUpdate {
  oneof update {
    SignedApproverKeySet approver_keys = 1;
    SignedConfiguration configuration = 2;
  }
}
message UpdateReceipt {
  string domain = 1; // agentkeyring.update-receipt.v1
  bytes device_spki_sha256 = 2;
  UpdateKind kind = 3;
  uint64 revision = 4;
  bytes update_sha256 = 5;
}
message SignedUpdateReceipt {
  bytes receipt = 1; // Exact serialized UpdateReceipt bytes.
  // DER ECDSA-P256/SHA256, using the device's existing non-biometric TLS key.
  bytes signature = 2;
}
message UpdateReceiptQuery {
  UpdateKind kind = 1;
  uint64 revision = 2;
  bytes update_sha256 = 3;
}
message UpdateReceipts { repeated SignedUpdateReceipt receipts = 1; }
message GetConfigurationUpdatesRequest { uint64 after_revision = 1; }
message ConfigurationUpdates {
  // Ascending pending withdrawals after the requested revision, then current.
  repeated SignedConfiguration configurations = 1;
}
